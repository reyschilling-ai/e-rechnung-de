name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: LibreOffice installieren
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Werkzeug-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/e-rechnung-de
          key: werkzeuge-${{ hashFiles('erechnung/werkzeuge.py') }}
      - run: pip install -e ".[test]" reportlab
      - run: pytest -v
